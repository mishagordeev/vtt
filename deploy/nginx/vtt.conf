# VTT «Вторых» на SpaceWeb VPS: nginx перед standalone-сервером Next.js.
#
#   sudo cp deploy/nginx/vtt.conf /etc/nginx/sites-available/vtt.conf
#   sudo sed -i "s/__DOMAIN__/vtt.example.com/g" /etc/nginx/sites-available/vtt.conf
#   sudo ln -sf /etc/nginx/sites-available/vtt.conf /etc/nginx/sites-enabled/vtt.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Всё это делает deploy/bootstrap.sh --domain <домен>. Здесь только HTTP:
# HTTPS и редирект с http добавляет certbot, он сам правит этот файл:
#   sudo certbot --nginx -d vtt.example.com --redirect
#
# Порт 3000 наружу не открывается: приложение слушает 127.0.0.1 (deploy/vtt.service).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Проверка домена для Let's Encrypt (HTTP-01) — отдаётся до проксирования.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Портреты персонажей уходят в лист картинками в data URL — тело POST крупное.
    client_max_body_size 8m;

    # Next.js сам не сжимает ответы: gzip делает nginx, в том числе для ответов прокси.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Ссылки на комнаты вида /r/A7K2QM и все /api/... идут в приложение.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Неизменяемая статика сборки: в имени файла хэш, можно кэшировать надолго.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
